<svg width="500" height="500" viewBox="0 0 680 680" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Trace logo</title>
  <desc>Circular dark logo with a geometric T shape made of circuit-board traces, cyan glow border, and the word TRACE at the bottom</desc>

  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0d1b2a"/>
      <stop offset="100%" stop-color="#050d15"/>
    </radialGradient>
    <radialGradient id="glowGrad" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#00d4ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00cfff"/>
      <stop offset="100%" stop-color="#0070cc"/>
    </linearGradient>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Dark circle background -->
  <circle cx="340" cy="340" r="318" fill="url(#bgGrad)"/>
  <circle cx="340" cy="340" r="318" fill="url(#glowGrad)"/>

  <!-- Circuit board background lines -->
  <g stroke="#00d4ff" stroke-width="0.8" stroke-opacity="0.12" fill="none">
    <line x1="80" y1="200" x2="160" y2="200"/>
    <line x1="160" y1="200" x2="160" y2="160"/>
    <circle cx="80" cy="200" r="4" fill="#00d4ff" fill-opacity="0.15" stroke="#00d4ff" stroke-opacity="0.2"/>
    <circle cx="160" cy="160" r="4" fill="#00d4ff" fill-opacity="0.15" stroke="#00d4ff" stroke-opacity="0.2"/>
    <line x1="95" y1="270" x2="145" y2="270"/>
    <line x1="95" y1="270" x2="95" y2="230"/>
    <circle cx="95" cy="230" r="4" fill="#00d4ff" fill-opacity="0.15" stroke="#00d4ff" stroke-opacity="0.2"/>
    <circle cx="145" cy="270" r="4" fill="#00d4ff" fill-opacity="0.15" stroke="#00d4ff" stroke-opacity="0.2"/>
    <line x1="110" y1="340" x2="170" y2="340"/>
    <line x1="110" y1="340" x2="110" y2="310"/>
    <circle cx="110" cy="310" r="4" fill="#00d4ff" fill-opacity="0.15" stroke="#00d4ff" stroke-opacity="0.2"/>
    <line x1="85" y1="420" x2="140" y2="420"/>
    <line x1="140" y1="420" x2="140" y2="390"/>
    <circle cx="85" cy="420" r="4" fill="#00d4ff" fill-opacity="0.15" stroke="#00d4ff" stroke-opacity="0.2"/>
    <circle cx="140" cy="390" r="4" fill="#00d4ff" fill-opacity="0.15" stroke="#00d4ff" stroke-opacity="0.2"/>
    <line x1="600" y1="200" x2="520" y2="200"/>
    <line x1="520" y1="200" x2="520" y2="160"/>
    <circle cx="600" cy="200" r="4" fill="#00d4ff" fill-opacity="0.15" stroke="#00d4ff" stroke-opacity="0.2"/>
    <circle cx="520" cy="160" r="4" fill="#00d4ff" fill-opacity="0.15" stroke="#00d4ff" stroke-opacity="0.2"/>
    <line x1="585" y1="270" x2="535" y2="270"/>
    <line x1="585" y1="270" x2="585" y2="230"/>
    <circle cx="585" cy="230" r="4" fill="#00d4ff" fill-opacity="0.15" stroke="#00d4ff" stroke-opacity="0.2"/>
    <circle cx="535" cy="270" r="4" fill="#00d4ff" fill-opacity="0.15" stroke="#00d4ff" stroke-opacity="0.2"/>
    <line x1="570" y1="340" x2="510" y2="340"/>
    <line x1="570" y1="340" x2="570" y2="310"/>
    <circle cx="570" cy="310" r="4" fill="#00d4ff" fill-opacity="0.15" stroke="#00d4ff" stroke-opacity="0.2"/>
    <line x1="595" y1="420" x2="540" y2="420"/>
    <line x1="540" y1="420" x2="540" y2="390"/>
    <circle cx="595" cy="420" r="4" fill="#00d4ff" fill-opacity="0.15" stroke="#00d4ff" stroke-opacity="0.2"/>
    <circle cx="540" cy="390" r="4" fill="#00d4ff" fill-opacity="0.15" stroke="#00d4ff" stroke-opacity="0.2"/>
  </g>

  <!-- Outer cyan ring -->
  <circle cx="340" cy="340" r="310" fill="none" stroke="#00d4ff" stroke-width="3" stroke-opacity="0.9" filter="url(#softGlow)"/>
  <circle cx="340" cy="340" r="300" fill="none" stroke="#00d4ff" stroke-width="0.8" stroke-opacity="0.25"/>

  <!-- T mark -->
  <polygon points="155,200 265,200 265,240 200,240 200,260 155,230" fill="url(#tGrad)" filter="url(#softGlow)"/>
  <polygon points="525,200 415,200 415,240 480,240 480,260 525,230" fill="url(#tGrad)" filter="url(#softGlow)"/>
  <rect x="295" y="200" width="90" height="60" fill="url(#tGrad)" filter="url(#softGlow)"/>

  <!-- Inner cutouts -->
  <polygon points="170,207 260,207 260,233 205,233 205,248 170,226" fill="#0a1622"/>
  <polygon points="510,207 420,207 420,233 475,233 475,248 510,226" fill="#0a1622"/>
  <rect x="302" y="207" width="76" height="46" fill="#0a1622"/>

  <!-- Vertical stem -->
  <rect x="316" y="258" width="48" height="180" fill="url(#tGrad)" filter="url(#softGlow)"/>
  <rect x="323" y="265" width="34" height="166" fill="#0a1622"/>

  <!-- Circuit traces on stem -->
  <g stroke="#00d4ff" stroke-width="1.2" fill="none" stroke-opacity="0.85">
    <line x1="340" y1="270" x2="340" y2="425"/>
    <line x1="340" y1="300" x2="330" y2="300"/>
    <line x1="340" y1="330" x2="328" y2="330"/>
    <line x1="340" y1="370" x2="330" y2="370"/>
    <line x1="340" y1="315" x2="350" y2="315"/>
    <line x1="340" y1="355" x2="352" y2="355"/>
    <line x1="340" y1="395" x2="350" y2="395"/>
  </g>
  <g fill="#00d4ff" fill-opacity="0.9">
    <circle cx="340" cy="290" r="3.5"/>
    <circle cx="340" cy="320" r="3.5"/>
    <circle cx="340" cy="350" r="3.5"/>
    <circle cx="340" cy="380" r="3.5"/>
    <circle cx="340" cy="415" r="3.5"/>
    <circle cx="328" cy="330" r="2.5"/>
    <circle cx="330" cy="300" r="2.5"/>
    <circle cx="330" cy="370" r="2.5"/>
    <circle cx="350" cy="315" r="2.5"/>
    <circle cx="352" cy="355" r="2.5"/>
    <circle cx="350" cy="395" r="2.5"/>
  </g>

  <!-- Circuit traces on horizontal bar -->
  <g stroke="#00d4ff" stroke-width="1" fill="none" stroke-opacity="0.7">
    <line x1="185" y1="215" x2="255" y2="215"/>
    <line x1="185" y1="225" x2="250" y2="225"/>
    <circle cx="185" cy="215" r="2.5" fill="#00d4ff" fill-opacity="0.8"/>
    <circle cx="185" cy="225" r="2.5" fill="#00d4ff" fill-opacity="0.8"/>
    <line x1="495" y1="215" x2="425" y2="215"/>
    <line x1="495" y1="225" x2="430" y2="225"/>
    <circle cx="495" cy="215" r="2.5" fill="#00d4ff" fill-opacity="0.8"/>
    <circle cx="495" cy="225" r="2.5" fill="#00d4ff" fill-opacity="0.8"/>
    <line x1="307" y1="215" x2="373" y2="215"/>
    <circle cx="307" cy="215" r="2.5" fill="#00d4ff" fill-opacity="0.8"/>
    <circle cx="373" cy="215" r="2.5" fill="#00d4ff" fill-opacity="0.8"/>
  </g>

  <!-- TRACE wordmark -->
  <text x="340" y="548" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="36" font-weight="700" letter-spacing="18" fill="#ffffff" fill-opacity="0.92">TRACE</text>
  <line x1="175" y1="540" x2="218" y2="540" stroke="#00d4ff" stroke-width="1.5" stroke-opacity="0.6"/>
  <line x1="462" y1="540" x2="505" y2="540" stroke="#00d4ff" stroke-width="1.5" stroke-opacity="0.6"/>
</svg>
